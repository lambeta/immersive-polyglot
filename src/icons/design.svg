<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Immersive Polyglot · candidate A · compact badger
       Tile #C2353E · face #FFF0EB · features #7A1822 · accent #E89070
       Short cheek patches (not crown→jaw); moderate ears; short forehead blaze -->
  <defs>
    <clipPath id="tileClip">
      <rect width="1024" height="1024" rx="236" ry="236"/>
    </clipPath>
  </defs>
  <g clip-path="url(#tileClip)">
    <rect width="1024" height="1024" fill="#C2353E"/>

    <!-- ears: moderate, clear of tile edge -->
    <ellipse cx="278" cy="236" rx="100" ry="116" fill="#FFF0EB"/>
    <ellipse cx="746" cy="236" rx="100" ry="116" fill="#FFF0EB"/>
    <ellipse cx="278" cy="244" rx="42" ry="50" fill="#E89070"/>
    <ellipse cx="746" cy="244" rx="42" ry="50" fill="#E89070"/>

    <!-- head inset for breathing room -->
    <ellipse cx="512" cy="540" rx="312" ry="286" fill="#FFF0EB"/>

    <!-- short forehead blaze — stops above eyes -->
    <path fill="#E89070" d="
      M512 278
      C552 278 572 320 572 358
      L564 420
      C560 442 540 454 512 454
      C484 454 464 442 460 420
      L452 358
      C452 320 472 278 512 278 Z"/>

    <!-- compact cheek patches — frame eyes only -->
    <ellipse cx="352" cy="520" rx="86" ry="72" fill="#7A1822"/>
    <ellipse cx="672" cy="520" rx="86" ry="72" fill="#7A1822"/>

    <!-- cream eye sparks (survive as 1–2px at 16) -->
    <circle cx="360" cy="510" r="26" fill="#FFF0EB"/>
    <circle cx="664" cy="510" r="26" fill="#FFF0EB"/>

    <ellipse cx="512" cy="700" rx="46" ry="32" fill="#7A1822"/>
  </g>
</svg>
