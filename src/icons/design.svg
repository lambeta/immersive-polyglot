<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- Immersive Polyglot · the page, two languages
       Upper half: the source, a Latin A. Lower half: the translation, 文.
       Drawn on the 16px grid so the toolbar size keeps both letters.
       Cream #F6E6D4 · red #C2353E · ink #3A1814 -->
  <defs>
    <clipPath id="tile">
      <rect width="16" height="16" rx="3.5"/>
    </clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="16" height="8" fill="#F6E6D4"/>
    <rect y="8" width="16" height="8" fill="#C2353E"/>
    <g fill="none" stroke="#3A1814" stroke-width="1.55" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="3">
      <path d="M3.15 6.85 L8 1.15 L12.85 6.85"/>
      <path d="M4.55 4.85 H11.45"/>
    </g>
    <g fill="none" stroke="#F6E6D4" stroke-width="1.45" stroke-linecap="butt" stroke-linejoin="miter">
      <path d="M3.15 9.7 H12.85"/>
      <path d="M4.7 11.55 L11.3 14.45"/>
      <path d="M11.3 11.55 L4.7 14.45"/>
    </g>
  </g>
</svg>
